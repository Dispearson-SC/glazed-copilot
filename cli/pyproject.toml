[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glazed-cli"
version = "0.1.0"
description = "Command line client for the Glazed store copilot backend"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "httpx>=0.27", "rich>=13"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
glazed = "glazed_cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
