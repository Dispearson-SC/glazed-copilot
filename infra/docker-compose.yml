name: glazed-copilot

# Secrets are never written here. Run through `make up` (or pass `--env-file .env`) so
# POSTGRES_PASSWORD and MINIMAX_API_KEY come from the git-ignored .env at the repository root.
x-core: &core
  # Agent-Core with the glazed addons (Phase 3, G7; Phase 5 since P5): branch feat/fast-comms of Agent-Core
  # (feat/glazed-addons before it), no longer the patched vertical/glazed branch.
  # AGENT_CORE_SRC is that checkout's ROOT (Core/ and
  # addons/), default the sibling ../Agent-Core; the build context is infra/core (Dockerfile and the
  # deployment's policy rule). Deploy and rollback: docs/agent-core-addons-runbook.md.
  build:
    context: ./core
    additional_contexts:
      agent_core: ${AGENT_CORE_SRC:-../../Agent-Core}
  environment: &core-env
    # Agent-Core creates and migrates its own app and DBOS databases through the admin URL.
    AGENT_CORE_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-change-me}@db:5432/agent_core
    AGENT_CORE_ADMIN_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-change-me}@db:5432/postgres
    AGENT_CORE_HTTP_HOST: 0.0.0.0
    AGENT_CORE_HTTP_PORT: "8000"
    # LLM provider is MiniMax; Agent-Core reads the credential as MINIMAX_API.
    MINIMAX_API: ${MINIMAX_API_KEY:-}
    # The addons (also the image's defaults, repeated here so the deployment states them).
    AGENT_CORE_ADDONS: http_tool_bridge,glazed_tools,plain_language,glazed_vertical,system_one_router
    AGENT_CORE_ADDONS_DIR: /app/addons
    AGENT_CORE_ADDONS_CONFIG: /app/addons/glazed_vertical/addons_config.yaml
    # Core's rules plus infra/core/policy/glazed_deployment.yaml (the ask_peer allow); the addon
    # brings the other glazed rules and needs this directory to exist.
    AGENT_CORE_POLICY_DIR: /app/Core/policy
    # Where the glazed tools call the internal API (was GLAZED_BACKEND_URL). Core reads the
    # backend's /openapi.json from here ONCE at startup and stops if it cannot.
    AGENT_CORE_ADDON__GLAZED_TOOLS__BASE_URL: http://backend:8080
    # Phase 5 (Agent-Core feat/fast-comms): System One routing before the orchestrator reasons. A confident
    # Jev answer sends the manager's turn to one specialist or answers a frequent intent with its fixed plan;
    # anything else runs the orchestrator as before. ON by default (Core D98: a routed turn runs as the specialist's
    # peer turn would, on behalf of the manager, so the glazed policy is unchanged); .env AGENT_CORE_TURN_ROUTING=false
    # turns it off with a recreate of core and core-peer-worker. Without JEV_API_KEY every turn simply passes
    # (missing_api_key) and runs the orchestrator. The key is passed through from .env, never written here.
    AGENT_CORE_TURN_ROUTING: ${AGENT_CORE_TURN_ROUTING:-true}
    AGENT_CORE_ADDON__SYSTEM_ONE_ROUTER__ROUTES_FILE: glazed_vertical/routing/system_one_routes.yaml
    AGENT_CORE_ADDON__SYSTEM_ONE_ROUTER__API_KEY_ENV: JEV_API_KEY
    AGENT_CORE_ADDON__SYSTEM_ONE_ROUTER__THRESHOLD: "0.5"
    JEV_API_KEY: ${JEV_API_KEY:-}
    # P11: stream each manager turn's reply (routed turns and intent plans included) to Core's SSE feed as it is
    # written, so the backend reports first-text latency and a partial reply. Peer turns never stream. ON by default;
    # .env AGENT_CORE_STREAM_REPLIES=false turns it off with a recreate of core and core-peer-worker (no drain).
    AGENT_CORE_STREAM_REPLIES: ${AGENT_CORE_STREAM_REPLIES:-true}
    # P12 (Agent-Core S10, D100): the fast path - one Jev call also says which of the ten intents the message asks
    # for, whether it asks to DO something, whether it depends on the conversation and how complex it is; with `on`
    # two or more detected intents run ONE composite (all their plans in parallel, one compose by the orchestrator).
    # SHADOW by default: the verdict is audited in audit_turn_routes (fast_path*) but every turn runs as before, so
    # live traffic can be compared first. .env AGENT_CORE_FAST_PATH=on applies it, =off asks Jev only the route
    # question again; either is a recreate of core and core-peer-worker, no drain. Intent threshold 0.7 from the
    # P12 benchmark (precision 86%, recall 84%). The composite reply cache is off unless
    # AGENT_CORE_FAST_PATH_CACHE_SECONDS is set (the backend sends the case date as X-Data-Version).
    AGENT_CORE_FAST_PATH: ${AGENT_CORE_FAST_PATH:-shadow}
    AGENT_CORE_FAST_PATH_INTENT_THRESHOLD: ${AGENT_CORE_FAST_PATH_INTENT_THRESHOLD:-0.7}
    AGENT_CORE_FAST_PATH_CACHE_SECONDS: ${AGENT_CORE_FAST_PATH_CACHE_SECONDS:-0}
  depends_on:
    db:
      condition: service_healthy
    backend:
      condition: service_healthy   # the glazed tools are built from its OpenAPI at startup

services:
  db:
    image: postgres:16
    container_name: glazed-db          # own container; never reuse the unrelated postgres:16-alpine one
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "55432:5432"
    volumes:
      - glazed_pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-glazed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  backend:
    build: ../backend
    container_name: glazed-backend
    depends_on:
      db:
        condition: service_healthy
    # Healthy once it serves /openapi.json: Agent-Core builds the glazed tools from it at startup.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/openapi.json', timeout=3)"]
      interval: 10s
      retries: 12
      start_period: 30s
    environment:
      GLAZED_STORAGE: postgres
      GLAZED_DATABASE_URL: postgresql://glazed_app:glazed_dev@db:5432/glazed_app
      GLAZED_DUCKDB_PATH: /data/glazed.duckdb
      GLAZED_RAW_PATH: /raw
      GLAZED_CORE_URL: http://core:8000
      # P5: follow each Core turn over SSE (first-text latency, partial reply); false -> poll GET /turns/{id} only.
      GLAZED_CORE_STREAM: ${GLAZED_CORE_STREAM:-true}
      # At most this many SSE streams at once (each holds a pooled connection); past it a turn is polled.
      GLAZED_CORE_MAX_STREAMS: ${GLAZED_CORE_MAX_STREAMS:-16}
      GLAZED_CORS_ORIGINS: ${GLAZED_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      BACKBOARD_API_KEY: ${BACKBOARD_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      # Voice (push-to-talk): STT/TTS proxied through the backend so the key never reaches the browser.
      GLAZED_VOICE: ${GLAZED_VOICE:-true}
      GLAZED_TTS_VOICE: ${GLAZED_TTS_VOICE:-Spanish_ConfidentWoman}
      GLAZED_TTS_MODEL: ${GLAZED_TTS_MODEL:-speech-2.8-turbo}
      GLAZED_STT_MODEL: ${GLAZED_STT_MODEL:-asr-1.0}
      # Login. Values come from the git-ignored .env; GLAZED_AUTH_REQUIRED=false keeps /api/v1 open until the UI integrates.
      GLAZED_AUTH_REQUIRED: ${GLAZED_AUTH_REQUIRED:-false}
      # Demo only: passwordless user picker. Never enable on a real deployment.
      GLAZED_DEMO_LOGIN: ${GLAZED_DEMO_LOGIN:-false}
      # order policy: margin (default) | waste_aware (waste penalty + promotions priced from history)
      GLAZED_ORDER_POLICY: ${GLAZED_ORDER_POLICY:-margin}
      GLAZED_WASTE_PENALTY: ${GLAZED_WASTE_PENALTY:-0}
      GLAZED_SERVICE_CAP: ${GLAZED_SERVICE_CAP:-}
      GLAZED_PROMO_SUGGESTIONS: ${GLAZED_PROMO_SUGGESTIONS:-true}
      GLAZED_COOKIE_SECURE: ${GLAZED_COOKIE_SECURE:-false}
      GLAZED_SESSION_SECRET: ${GLAZED_SESSION_SECRET:-}
      GLAZED_ADMIN_EMAIL: ${GLAZED_ADMIN_EMAIL:-}
      GLAZED_ADMIN_PASSWORD: ${GLAZED_ADMIN_PASSWORD:-}
      # Holdout forecast (Parquet) produced by the separate forecast job. Absent file -> baseline forecast.
      GLAZED_FORECAST_PATH: ${GLAZED_FORECAST_PATH:-/forecast/forecast.parquet}
    volumes:
      - ../../Dataset/clean:/data:ro
      - ../../Dataset/raw:/raw:ro
      # GLAZED_FORECAST_DIR defaults to an empty placeholder dir so `make up` never depends on the file existing;
      # the Makefile points it at ../Dataset/forecast/out when that directory is present.
      - ${GLAZED_FORECAST_DIR:-./no-forecast}:/forecast:ro
    ports:
      - "${GLAZED_BACKEND_PORT:-8100}:8080"

  core:
    <<: *core
    container_name: glazed-core
    command: ["python", "-m", "agent_core", "serve"]
    environment: *core-env
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3)"]
      interval: 10s
      retries: 12
      start_period: 30s
    ports:
      - "${GLAZED_CORE_HOST_PORT:-8001}:8000"

  core-peer-worker:
    <<: *core
    container_name: glazed-core-peer-worker
    command: ["python", "-m", "agent_core", "peer-worker"]
    environment: *core-env
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy   # the glazed tools are built from its OpenAPI at startup
      core:
        condition: service_healthy   # the core serve process creates and migrates the databases first

  # Public web (PWA build + /api proxy) behind the Coolify Traefik proxy, with HTTPS and basic auth.
  # Dev alternative: `npm run dev` in frontend/ (http://localhost:5173).
  web:
    build:
      context: ..
      dockerfile: infra/web/Dockerfile
    container_name: glazed-web
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.glazed-web-http.rule=Host(`${GLAZED_PUBLIC_HOST:-glazed.farone.cloud}`)
      - traefik.http.routers.glazed-web-http.entrypoints=http
      - traefik.http.routers.glazed-web-http.middlewares=glazed-web-https-redirect
      - traefik.http.middlewares.glazed-web-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.glazed-web.rule=Host(`${GLAZED_PUBLIC_HOST:-glazed.farone.cloud}`)
      - traefik.http.routers.glazed-web.entrypoints=https
      - traefik.http.routers.glazed-web.tls=true
      - traefik.http.routers.glazed-web.tls.certresolver=letsencrypt
      # GLAZED_WEB_GATE=glazed-web-open drops the basic auth (public demo; the app login still applies)
      - traefik.http.routers.glazed-web.middlewares=${GLAZED_WEB_GATE:-glazed-web-auth}
      - traefik.http.middlewares.glazed-web-open.headers.contentTypeNosniff=true
      - traefik.http.middlewares.glazed-web-auth.basicauth.users=${GLAZED_WEB_BASICAUTH:?set GLAZED_WEB_BASICAUTH in .env}
      - traefik.http.services.glazed-web.loadbalancer.server.port=80

volumes:
  glazed_pgdata:

networks:
  coolify:
    external: true
