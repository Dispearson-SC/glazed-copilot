name: glazed-copilot

# Secrets are never written here. Run through `make up` (or pass `--env-file .env`) so
# POSTGRES_PASSWORD and MINIMAX_API_KEY come from the git-ignored .env at the repository root.
x-core: &core
  build:
    context: ../../Agent-Core/Core
    dockerfile: ../../glazed-copilot/infra/core/Dockerfile
  environment: &core-env
    # Agent-Core creates and migrates its own app and DBOS databases through the admin URL.
    AGENT_CORE_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-change-me}@db:5432/agent_core
    AGENT_CORE_ADMIN_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-change-me}@db:5432/postgres
    AGENT_CORE_HTTP_HOST: 0.0.0.0
    AGENT_CORE_HTTP_PORT: "8000"
    # LLM provider is MiniMax; Agent-Core reads the credential as MINIMAX_API.
    MINIMAX_API: ${MINIMAX_API_KEY:-}
    GLAZED_BACKEND_URL: http://backend:8080  # where the Glazed tools call the internal API
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16
    container_name: glazed-db          # own container; never reuse the unrelated postgres:16-alpine one
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "55432:5432"
    volumes:
      - glazed_pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-glazed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  backend:
    build: ../backend
    container_name: glazed-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      GLAZED_STORAGE: postgres
      GLAZED_DATABASE_URL: postgresql://glazed_app:glazed_dev@db:5432/glazed_app
      GLAZED_DUCKDB_PATH: /data/glazed.duckdb
      GLAZED_RAW_PATH: /raw
      GLAZED_CORE_URL: http://core:8000
      GLAZED_CORS_ORIGINS: ${GLAZED_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      BACKBOARD_API_KEY: ${BACKBOARD_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      # Login. Values come from the git-ignored .env; GLAZED_AUTH_REQUIRED=false keeps /api/v1 open until the UI integrates.
      GLAZED_AUTH_REQUIRED: ${GLAZED_AUTH_REQUIRED:-false}
      # Demo only: passwordless user picker. Never enable on a real deployment.
      GLAZED_DEMO_LOGIN: ${GLAZED_DEMO_LOGIN:-false}
      # order policy: margin (default) | waste_aware (waste penalty + promotions priced from history)
      GLAZED_ORDER_POLICY: ${GLAZED_ORDER_POLICY:-margin}
      GLAZED_WASTE_PENALTY: ${GLAZED_WASTE_PENALTY:-0}
      GLAZED_SERVICE_CAP: ${GLAZED_SERVICE_CAP:-}
      GLAZED_PROMO_SUGGESTIONS: ${GLAZED_PROMO_SUGGESTIONS:-true}
      GLAZED_COOKIE_SECURE: ${GLAZED_COOKIE_SECURE:-false}
      GLAZED_SESSION_SECRET: ${GLAZED_SESSION_SECRET:-}
      GLAZED_ADMIN_EMAIL: ${GLAZED_ADMIN_EMAIL:-}
      GLAZED_ADMIN_PASSWORD: ${GLAZED_ADMIN_PASSWORD:-}
      # Holdout forecast (Parquet) produced by the separate forecast job. Absent file -> baseline forecast.
      GLAZED_FORECAST_PATH: ${GLAZED_FORECAST_PATH:-/forecast/forecast.parquet}
    volumes:
      - ../../Dataset/clean:/data:ro
      - ../../Dataset/raw:/raw:ro
      # GLAZED_FORECAST_DIR defaults to an empty placeholder dir so `make up` never depends on the file existing;
      # the Makefile points it at ../Dataset/forecast/out when that directory is present.
      - ${GLAZED_FORECAST_DIR:-./no-forecast}:/forecast:ro
    ports:
      - "${GLAZED_BACKEND_PORT:-8100}:8080"

  core:
    <<: *core
    container_name: glazed-core
    command: ["python", "-m", "agent_core", "serve"]
    environment: *core-env
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3)"]
      interval: 10s
      retries: 12
      start_period: 30s
    ports:
      - "${GLAZED_CORE_HOST_PORT:-8001}:8000"

  core-peer-worker:
    <<: *core
    container_name: glazed-core-peer-worker
    command: ["python", "-m", "agent_core", "peer-worker"]
    environment: *core-env
    depends_on:
      db:
        condition: service_healthy
      core:
        condition: service_healthy   # the core serve process creates and migrates the databases first

  # Public web (PWA build + /api proxy) behind the Coolify Traefik proxy, with HTTPS and basic auth.
  # Dev alternative: `npm run dev` in frontend/ (http://localhost:5173).
  web:
    build:
      context: ..
      dockerfile: infra/web/Dockerfile
    container_name: glazed-web
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.glazed-web-http.rule=Host(`${GLAZED_PUBLIC_HOST:-glazed.farone.cloud}`)
      - traefik.http.routers.glazed-web-http.entrypoints=http
      - traefik.http.routers.glazed-web-http.middlewares=glazed-web-https-redirect
      - traefik.http.middlewares.glazed-web-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.glazed-web.rule=Host(`${GLAZED_PUBLIC_HOST:-glazed.farone.cloud}`)
      - traefik.http.routers.glazed-web.entrypoints=https
      - traefik.http.routers.glazed-web.tls=true
      - traefik.http.routers.glazed-web.tls.certresolver=letsencrypt
      # GLAZED_WEB_GATE=glazed-web-open drops the basic auth (public demo; the app login still applies)
      - traefik.http.routers.glazed-web.middlewares=${GLAZED_WEB_GATE:-glazed-web-auth}
      - traefik.http.middlewares.glazed-web-open.headers.contentTypeNosniff=true
      - traefik.http.middlewares.glazed-web-auth.basicauth.users=${GLAZED_WEB_BASICAUTH:?set GLAZED_WEB_BASICAUTH in .env}
      - traefik.http.services.glazed-web.loadbalancer.server.port=80

volumes:
  glazed_pgdata:

networks:
  coolify:
    external: true
