server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Re-resolve the backend through Docker's DNS so a recreated container (new IP) is picked up without a reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API calls go to the backend on the compose network. A variable proxy_pass without a URI part forwards the
    # original request URI unchanged, which matches the previous static behaviour.
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The internal agent API is never exposed publicly.
    location /internal/ {
        return 404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
